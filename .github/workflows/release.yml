name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Run complete verification
        shell: pwsh
        run: npm run check:all

      - name: Bootstrap pinned Inno Setup
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/bootstrap-inno-setup.ps1

      - name: Build release artifacts
        shell: pwsh
        run: |
          $package = Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json
          $expectedTag = if ("${{ github.ref_type }}" -eq "tag") {
            "${{ github.ref_name }}"
          } else {
            "v$($package.version)"
          }
          npm run build:release -- -ExpectedTag $expectedTag

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: video-radar-${{ github.ref_name }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish stable tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $artifacts = @(Get-ChildItem -LiteralPath dist/release -File | Sort-Object Name | ForEach-Object { $_.FullName })
          gh release create "${{ github.ref_name }}" $artifacts --verify-tag --generate-notes --title "Video Radar ${{ github.ref_name }}"
