<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Configurar downloads · Vídeo Radar</title>
    <link rel="stylesheet" href="styles/options.css" />
  </head>
  <body>
    <main class="settings-shell">
      <header class="settings-header">
        <span class="eyebrow">VÍDEO RADAR / PREFERÊNCIAS</span>
        <h1>Destino dos downloads</h1>
        <p>Use a mesma pasta para vídeos diretos, HLS e YouTube.</p>
      </header>

      <section class="settings-card" aria-labelledby="destination-title">
        <div class="section-heading">
          <span class="section-index">01</span>
          <div>
            <p class="eyebrow">DESTINO DOS DOWNLOADS</p>
            <h2 id="destination-title">Onde salvar os vídeos</h2>
          </div>
        </div>

        <div class="folder-row">
          <div class="folder-summary">
            <span class="field-label">Pasta padrão</span>
            <output id="default-folder">Carregando…</output>
          </div>
          <button id="choose-folder" type="button">Alterar pasta padrão…</button>
        </div>

        <label class="switch-row">
          <input id="ask-every-time" type="checkbox" />
          <span>
            <strong>Perguntar onde salvar cada download</strong>
            <small>O navegador ou o Windows solicitará o destino antes de começar.</small>
          </span>
        </label>

        <p id="save-status" class="save-status" role="status" aria-live="polite"></p>
      </section>
    </main>
    <script type="module" src="src/options/main.js"></script>
  </body>
</html>
